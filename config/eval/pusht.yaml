defaults:
- solver: cem
- _self_
world:
  env_name: swm/PushT-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
  - action
  - proprio
  - state
seed: 42
policy: checkpoints/pusht
plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: pusht_expert_train
  callables:
  - method: _set_state
    args:
      state:
        value: state
  - method: _set_goal_state
    args:
      goal_state:
        value: goal_state
  probe_output_filename: probe_results.txt
output:
  filename: pusht_results.txt
  directory: results
hydra:
  output_subdir: null
  run:
    dir: results/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
