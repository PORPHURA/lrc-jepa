defaults:
- solver: cem
- _self_
world:
  env_name: swm/ReacherDMControl-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  task: qpos_match
dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
  - action
seed: 42
policy: checkpoints/reacher
plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: reacher
  callables:
  - method: set_state
    args:
      qpos:
        value: qpos
      qvel:
        value: qvel
  - method: set_target_qpos
    args:
      target_qpos:
        value: goal_qpos
  probe_output_filename: probe_results.txt
output:
  filename: dmc_results.txt
  directory: results
hydra:
  output_subdir: null
  run:
    dir: results/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
